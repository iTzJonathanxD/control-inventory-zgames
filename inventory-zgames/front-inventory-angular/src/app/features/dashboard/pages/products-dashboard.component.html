<div class="row">
  <div class="col-12">
    <div
      class="page-title-head d-flex align-items-sm-center flex-sm-row flex-column"
    >
      <div class="flex-grow-1">
        <h4 class="fs-18 fw-semibold m-0">
          {{ 'DASHBOARD.PRODUCTS.TITLE' | translate }}
        </h4>
        <p class="text-muted mb-0">
          {{ 'DASHBOARD.PRODUCTS.SUBTITLE' | translate }}
        </p>
      </div>
      <div class="mt-3 mt-sm-0">
        <div class="d-flex gap-2"></div>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col">
    <product-stats />
  </div>
</div>

<div class="row">
  <div class="col-xxl-8">
    <sales-overview />
  </div>
  <div class="col-xxl-4">
    <low-stock-products />
  </div>
</div>


<div class="row" *ngIf="showAlerts">
  <div class="col-12">
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      <i class="ti ti-alert-triangle me-2"></i>
      <strong>{{ 'DASHBOARD.ALERT.TITLE' | translate }}</strong>
      {{ 'DASHBOARD.ALERT.MESSAGE' | translate: { count: lowStockCount } }}
      
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        (click)="dismissAlert()"
      ></button>
    </div>
  </div>
</div>
