<div class="product-filters">
  <div class="row g-3 align-items-center">
    
    <div class="col-lg-4 col-md-6">
      <div class="search-box">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="fas fa-search text-muted"></i>
          </span>
          <input
            type="text"
            class="form-control border-start-0 ps-0"
            [placeholder]="'USER_PRODUCTS.SEARCH_PLACEHOLDER' | translate"
            [value]="searchTerm"
            (input)="onSearchChange($event.target.value)"
          />
        </div>
      </div>
    </div>

    
    <div class="col-lg-3 col-md-6">
      <select
        class="form-select"
        [value]="selectedCategory"
        (change)="onCategoryChange($event.target.value)"
      >
        <option value="">
          {{ 'USER_PRODUCTS.ALL_CATEGORIES' | translate }}
        </option>
        <option *ngFor="let category of categories" [value]="category">
          {{ category }}
        </option>
      </select>
    </div>

    
    <div class="col-lg-3 col-md-6">
      <select
        class="form-select"
        [value]="sortBy"
        (change)="onSortChange($event.target.value)"
      >
        <option value="name">
          {{ 'USER_PRODUCTS.SORT_BY_NAME' | translate }}
        </option>
        <option value="price-asc">
          {{ 'USER_PRODUCTS.SORT_BY_PRICE_ASC' | translate }}
        </option>
        <option value="price-desc">
          {{ 'USER_PRODUCTS.SORT_BY_PRICE_DESC' | translate }}
        </option>
        <option value="rating">
          {{ 'USER_PRODUCTS.SORT_BY_RATING' | translate }}
        </option>
      </select>
    </div>

    
    <div class="col-lg-2 col-md-6">
      <button
        type="button"
        class="btn btn-outline-secondary w-100"
        (click)="clearFilters()"
        [disabled]="!searchTerm && !selectedCategory && sortBy === 'name'"
      >
        <i class="fas fa-times me-1"></i>
        {{ 'USER_PRODUCTS.CLEAR' | translate }}
      </button>
    </div>
  </div>
</div>
