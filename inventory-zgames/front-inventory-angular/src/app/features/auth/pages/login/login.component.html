<div class="auth-container">
  <div class="auth-card">
    
    <div class="auth-welcome-panel">
      <div class="welcome-content">
        <div class="brand-section">
          
          <div class="logo-container">
            <img src="assets/images/Recurso-3.png" alt="Logo" class="brand-logo" />
          </div>
          
          <h1 class="brand-title">Sistema de Inventario</h1>
        </div>
      </div>
    </div>

    
    <div class="auth-form-panel">
      <div class="form-container">
        
        
        
        <div *ngIf="errorMessage.length > 0" class="alert alert-danger alert-modern d-flex align-items-center mb-4" role="alert">
          <i class="fas fa-exclamation-triangle me-2"></i>
          <span>{{ errorMessage }}</span>
        </div>

        
        <form [formGroup]="signInForm" (ngSubmit)="login()" class="auth-form">
          
          
          <div class="mb-3">
            <label for="email" class="form-label form-label-modern mb-2">
              {{ 'LOGIN.INPUT.EMAIL' | translate }}
            </label>
            <input
              formControlName="email"
              type="email"
              id="email"
              class="form-control form-control-modern"
              [placeholder]="'LOGIN.PLACEHOLDER.EMAIL' | translate"
              autocomplete="email"
            />
          </div>

          
          <div class="mb-3 position-relative">
            <label for="password" class="form-label form-label-modern mb-2">
              {{ 'LOGIN.INPUT.PASSWORD' | translate }}
            </label>
            <input
              [type]="isShowPassword ? 'text' : 'password'"
              formControlName="password"
              id="password"
              class="form-control form-control-modern pe-5"
              [placeholder]="'LOGIN.PLACEHOLDER.PASSWORD' | translate"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="btn btn-link password-toggle position-absolute"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="isShowPassword ? 'Hide password' : 'Show password'"
            >
              
              <svg *ngIf="!isShowPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="isShowPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>

          
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check form-check-modern">
              <input
                type="checkbox"
                class="form-check-input"
                id="rememberMe"
                formControlName="rememberMe"
              />
              <label class="form-check-label" for="rememberMe">
                {{ 'LOGIN.INPUT.REMEMBER_ME' | translate }}
              </label>
            </div>

            <a href="#" class="forgot-password-link">
              {{ 'LOGIN.FORGOT_PASSWORD' | translate }}
            </a>
          </div>

          
          <button 
            class="btn btn-primary btn-modern w-100 mb-3" 
            type="submit" 
            [disabled]="isLoading"
          >
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
            <i *ngIf="!isLoading" class="fas fa-sign-in-alt me-2"></i>
            {{ 'LOGIN.BUTTON.SIGN_IN' | translate }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
